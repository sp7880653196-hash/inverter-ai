<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<title>Inverter PCB Pehchan</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#5b6570;--ac:#0b6bcb;--bad:#c62828;--ok:#1a7f37;--bd:#dde1e6}
@media (prefers-color-scheme:dark){:root{--bg:#14171a;--card:#1e2327;--tx:#e8eaed;--mu:#9aa4ae;--ac:#5aa9ff;--bad:#ff7b72;--ok:#4cc26a;--bd:#323a41}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:12px;max-width:640px;margin:auto}
h1{font-size:1.25rem;margin:6px 0}h2{font-size:1.05rem;margin:16px 0 6px}
.mu{color:var(--mu);font-size:.88rem}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
input[type=file]{width:100%;margin:6px 0}
img.pv{width:100%;max-height:260px;object-fit:contain;border-radius:8px;border:1px solid var(--bd);margin-top:6px}
button{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 16px;width:100%;margin-top:10px}
button:disabled{opacity:.5}
.m{display:inline-block;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:0 8px;font-size:.82rem}
.g{color:var(--ok)}.r{color:var(--bad)}.warn{border-left:4px solid var(--bad)}
</style>
</head>
<body>
<h1>Inverter PCB Pehchan</h1>
<p class="mu">PCB ki photo daalo. Company, model aur parts ki reading ka andaaza milega.</p>
<div class="card"><b>Front (component side)</b><input type="file" id="f1" accept="image/*"><img class="pv" id="p1" hidden></div>
<div class="card"><b>Back (solder side), optional</b><input type="file" id="f2" accept="image/*"><img class="pv" id="p2" hidden></div>
<button id="go" disabled>Pehchano / Identify</button>
<div id="st" class="mu"></div>
<div id="out"></div>
<script>
var imgs=[null,null];
function e(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function shrink(f){return new Promise(function(ok,no){var fr=new FileReader();fr.onerror=no;fr.onload=function(){var im=new Image();im.onerror=no;im.onload=function(){var s=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8))};im.src=fr.result};fr.readAsDataURL(f)})}
function pick(i){var inp=document.getElementById('f'+(i+1)),pv=document.getElementById('p'+(i+1));
inp.onchange=function(){var f=inp.files[0];if(!f)return;shrink(f).then(function(d){imgs[i]=d;pv.src=d;pv.hidden=false;document.getElementById('go').disabled=!imgs[0]}).catch(function(){document.getElementById('st').textContent='Photo nahi khuli. Dusri photo try karo.'})}}
pick(0);pick(1);
function show(t){var j;try{j=JSON.parse(t.replace(/^```(json)?/i,'').replace(/```\s*$/,'').trim())}catch(x){document.getElementById('out').innerHTML='<div class="card">'+e(t)+'</div>';return}
var h='<div class="card"><b>Company:</b> '+e(j.company||'unknown')+' <span class="m">'+e(j.company_confidence||'')+'</span><br><b>Model:</b> '+e(j.model||'unknown')+'<br><span class="mu">Saboot: '+e(j.evidence||'none')+'</span><br><span class="mu">Board type: '+e(j.board_type||'-')+'</span></div><h2>Parts aur reading</h2>';
(j.components||[]).forEach(function(c){h+='<div class="card"><b>'+e(c.part)+'</b> <span class="mu">'+e(c.marking)+'</span><br><span class="m">'+e(c.mode)+'</span> <span class="mu">'+e(c.pins)+'</span><br><span class="g">Theek: '+e(c.expected)+'</span><br><span class="r">Kharab: '+e(c.bad_sign)+'</span></div>'});
h+='<div class="card warn">'+e(j.notes||'')+'<br><span class="mu">Ye photo se lagaya gaya andaaza hai, kisi model ki pakki reading nahi. Chalte hue board se milao.</span></div>';
document.getElementById('out').innerHTML=h}
document.getElementById('go').onclick=function(){var b=this,st=document.getElementById('st');b.disabled=true;st.textContent='Soch raha hu... (1 minute tak lag sakta hai)';document.getElementById('out').innerHTML='';
fetch('/api/identify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({images:imgs.filter(Boolean)})})
.then(function(r){return r.json().then(function(j){return{ok:r.ok,j:j}})})
.then(function(x){if(!x.ok)throw new Error(x.j.error||'Error');st.textContent='';show(x.j.text)})
.catch(function(x){st.textContent=x.message||'Kuch gadbad hui. Dobara try karo.'})
.then(function(){b.disabled=false})};
</script>
</body>
</html>
